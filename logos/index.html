<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo sketches — Ali’s Personal Google API Client</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .logos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 24px; }
    figure { margin: 0; border: 1px solid var(--rule); padding: 20px; }
    .large { display: block; width: 100%; max-width: 256px; height: auto; margin: 0 auto 20px; }
    figcaption { font-size: 14px; }
    .small { display: flex; align-items: center; gap: 16px; margin: 16px 0; }
    .small img { flex: none; }
  </style>
</head>
<body>
  <header><a class="site-name" href="../">ali / personal google api</a></header>
  <main>
    <p class="meta">five little identities for one personal client</p>
    <h1>Logo sketches</h1>
    <p>Standalone SVGs, drawn on a 256 × 256 canvas. Each preview includes 32px and 64px versions to check legibility at small sizes. Follow a title to open and save the original SVG.</p>
    <div class="logos">
      <figure>
        <img class="large" src="terminal-cloud.svg" alt="Pixel cloud and command prompt inside a terminal" width="256" height="256">
        <figcaption><a href="terminal-cloud.svg">01 / Terminal cloud</a><div class="small" aria-hidden="true"><img src="terminal-cloud.svg" width="32" height="32" alt=""><img src="terminal-cloud.svg" width="64" height="64" alt=""></div>The original. A cloud with a command line.</figcaption>
      </figure>
      <figure>
        <img class="large" src="cloud-cabinet.svg" alt="Blue cloud filed inside a two-drawer cabinet" width="256" height="256">
        <figcaption><a href="cloud-cabinet.svg">02 / Cloud cabinet</a><div class="small" aria-hidden="true"><img src="cloud-cabinet.svg" width="32" height="32" alt=""><img src="cloud-cabinet.svg" width="64" height="64" alt=""></div>Cloud storage, physically interpreted.</figcaption>
      </figure>
      <figure>
        <img class="large" src="floppy-halo.svg" alt="Blue floppy disk with a golden halo" width="256" height="256">
        <figcaption><a href="floppy-halo.svg">03 / Blessed backup</a><div class="small" aria-hidden="true"><img src="floppy-halo.svg" width="32" height="32" alt=""><img src="floppy-halo.svg" width="64" height="64" alt=""></div>May your restores always succeed.</figcaption>
      </figure>
      <figure>
        <img class="large" src="home-cloud.svg" alt="Terminal showing tilde, slash, and a cloud" width="256" height="256">
        <figcaption><a href="home-cloud.svg">04 / Home cloud</a><div class="small" aria-hidden="true"><img src="home-cloud.svg" width="32" height="32" alt=""><img src="home-cloud.svg" width="64" height="64" alt=""></div>There’s no place like ~/cloud.</figcaption>
      </figure>
      <figure>
        <img class="large" src="folder-crab.svg" alt="Smiling blue crab holding a file folder" width="256" height="256">
        <figcaption><a href="folder-crab.svg">05 / The file porter</a><div class="small" aria-hidden="true"><img src="folder-crab.svg" width="32" height="32" alt=""><img src="folder-crab.svg" width="64" height="64" alt=""></div>Small crab. Excellent employee.</figcaption>
      </figure>
    </div>
  </main>
  <footer><span>Ali Al-Alak</span><a href="../">← home</a></footer>
</body>
</html>
